<div class="card shadow-sm mb-4">
    <div class="card-body">
        <form method="get" class="row g-3 align-items-end">
            <div class="col-md-3">
                <label for="id_date_from" class="form-label">From</label>
                <input type="date" name="date_from" id="id_date_from" class="form-control" value="{{ start_date|date:'Y-m-d' }}">
            </div>
            <div class="col-md-3">
                <label for="id_date_to" class="form-label">To</label>
                <input type="date" name="date_to" id="id_date_to" class="form-control" value="{{ end_date|date:'Y-m-d' }}">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-filter me-1"></i>Apply
                </button>
            </div>
            <div class="col-md-4">
                <div class="btn-group w-100">
                    <a href="?preset=7d" class="btn btn-outline-secondary">7 Days</a>
                    <a href="?" class="btn btn-outline-secondary">30 Days</a>
                    <a href="?preset=90d" class="btn btn-outline-secondary">90 Days</a>
                    <a href="?preset=ytd" class="btn btn-outline-secondary">YTD</a>
                </div>
            </div>
        </form>
    </div>
</div>
