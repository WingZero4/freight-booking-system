{% extends 'base.html' %}

{% block title %}Password Reset Complete - Freight Booking{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4 text-center">
                <div class="mb-4">
                    <i class="fas fa-check-circle fa-3x text-success"></i>
                </div>
                <h4 class="mb-3">Password Reset Successfully!</h4>
                <p class="text-muted mb-4">
                    Your password has been set. You can now log in with your new password.
                </p>
                <a href="{% url 'login' %}" class="btn btn-themed-primary">
                    <i class="fas fa-sign-in-alt me-1"></i>Log In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
