<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Freight Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">Freight Booking</h3>
                        <p class="text-center text-muted mb-4">Customer Portal</p>

                        {% if form.errors %}
                        <div class="alert alert-danger">
                            Invalid username or password.
                        </div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" name="username" id="username" class="form-control" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" name="password" id="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>

                        <div class="text-center mt-3">
                            <a href="{% url 'password_reset' %}" class="text-decoration-none small">
                                Forgot Password?
                            </a>
                        </div>

                        <hr class="my-4">
                        <p class="text-center text-muted small mb-0">
                            Demo: acme_user / demo123
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
